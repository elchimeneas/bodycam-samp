; BODYCAM SA-MP 0.4.4 - CONFIGURACION PARA JUGADORES
; Guia y descargas: https://github.com/elchimeneas/bodycam-samp
;
; Edita ESTE archivo dentro de la carpeta de GTA, despues de instalar.
; Guarda y pulsa Ctrl+Shift+R dentro del juego para recargarlo.
; El archivo .asi solo se cambia con GTA cerrado y requiere reiniciar GTA.
; Usa punto decimal (0.20), no coma. 1 = si, 0 = no.
; No pongas comentarios al final de una linea con valor: usa otra linea con ;.
; Conserva los nombres de las opciones y guarda como UTF-8.
; Si borras una opcion se usa el valor predeterminado, igual al de este INI.
;
; CONTROLES
; V: alterna las vistas de GTA. A pie: lejana > media > cercana > BODYCAM.
; Otra pulsacion vuelve a la lejana. Si reasignaste la vista, usa esa tecla.
; Ctrl+Shift+B: muestra/oculta solo el rotulo; no cambia la camara ni el efecto.
; Ctrl+Shift+R: recarga todas las opciones del INI, incluido el rotulo.
; Bodycam simula una camara: NO graba ni guarda videos.

[Bodycam]
; Mostrar el rotulo (fecha, hora, identificacion e icono).
; Solo se dibuja cuando estas en la vista bodycam. Predeterminado: 1.
Enabled=1

; Nombre o rango que quieras mostrar. Hasta 48 caracteres; admite tildes.
; No uses comillas. Ejemplo: Officer=AGENTE MARTINEZ
Officer=AGENTE

; Numero de placa, hasta 16 caracteres. Vacio = no mostrar la placa.
; Ejemplo: Badge=0000
Badge=

; Identificador de la camara, hasta 24 caracteres. Es solo texto decorativo.
CameraId=CAM-0001

; Mostrar la linea con el nombre y la placa. Predeterminado: 1.
ShowOfficer=1

; Mostrar el logotipo amarillo junto al texto. Predeterminado: 1.
; El logo esta incluido en Bodycam.asi; no necesita imagenes externas.
ShowLogo=1

; 0 = fecha/hora local de tu PC y su desfase horario. 1 = UTC (termina en Z).
; No usa la hora del servidor ni la hora del mundo de GTA.
UseUTC=0

; Tamano general del rotulo. Rango: 0.5 a 2.0. Predeterminado: 1.0.
; La interfaz tambien se adapta automaticamente a la altura de tu pantalla.
Scale=1.0

; Tamano de letra a 1080p antes del escalado. Rango: 12 a 36. Defecto: 20.
FontSize=20

; Separacion desde el borde DERECHO, en pixeles de referencia a 1080p.
; Aumenta este valor para mover el rotulo a la IZQUIERDA y evitar el HUD.
; 260 equivale aproximadamente a 520 pixeles a 2160p con Scale=1.
; Scale no cambia este margen; se limita para no salir de pantalla.
; Rango: 0 a 1920. Predeterminado: 260.
MarginRight=260

; Separacion desde ARRIBA, misma escala que MarginRight.
; Aumenta para bajar el rotulo. Rango: 0 a 1080. Predeterminado: 24.
MarginTop=24

; Opacidad del texto y del icono. 255 = opaco; 40 = muy transparente.
; Rango: 40 a 255. Predeterminado: 235. Para ocultarlo usa Enabled=0.
Opacity=235

; Teclas del rotulo y de recarga. Son codigos Virtual-Key de Windows.
; 0x42 = B, 0x52 = R. No afectan a la tecla V de la camara.
; Rango: 1 a 254. Mejor conservar estos valores para evitar conflictos.
ToggleKey=0x42
ReloadKey=0x52

; Teclas que deben acompanarlas: Ctrl=1, Shift=2, Alt=4; suma las deseadas.
; 3 = Ctrl+Shift (defecto), 5 = Ctrl+Alt, 6 = Shift+Alt, 7 = las tres.
; 0 = sin modificadores. Rango: 0 a 7. No pulses modificadores adicionales.
Modifiers=3

[Camera]
; 1 = incluir bodycam en el ciclo de vistas; 0 = conservar solo vistas GTA.
; No empieza activada: entra con la tecla de cambiar vista, normalmente V.
CameraEnabled=1

; Permitir la vista en vehiculos. 0 = solo a pie. Predeterminado: 1.
; Entrar/salir del vehiculo reinicia la seleccion: vuelve a usar V.
; El interior puede tapar la vista en algunos modelos de vehiculo.
CameraInVehicles=1

; Campo de vision VISUAL de la camara, en grados.
; El plugin adapta el FOV interno al ajuste panoramico proporcional de GTA
; para mantener alineados la mira y el disparo. No requiere calibracion manual.
; Mas alto = encuadre mas amplio. No cambia la resolucion de pantalla.
; Rango: 60 a 120. Predeterminado: 100. Un FOV mayor puede costar mas FPS.
CameraFOV=100

; Distancia minima a la que se dibuja la geometria (plano de recorte).
; Un valor bajo ayuda a que los brazos cercanos no aparezcan cortados.
; No elimina la cara si la camara esta dentro de ella: ajusta la posicion.
; Unidades del juego. Rango: 0.04 a 0.25. Predeterminado: 0.04. No uses 0.
CameraNearClip=0.04

; POSICION BASE: desplazamientos desde el hueso del pecho del personaje.
; Son unidades del juego, aproximadamente metros. Prueba cambios de 0.01.
; La orientacion sigue al personaje: izquierda/derecha son las suyas.
; Estas tres opciones tambien afectan al apuntado y a los vehiculos.

; ADELANTE: aumenta para alejar la lente del pecho/cara.
; Rango: 0.05 a 0.35. Predeterminado: 0.20.
ChestForward=0.20

; LATERAL: positivo = derecha; negativo = izquierda; 0 = centro.
; Para moverla un poco a la izquierda: por ejemplo de 0.01 a 0.00.
; Rango: -0.20 a 0.20. Predeterminado: 0.01.
ChestSide=0.01

; ALTURA: positivo = subir; negativo = bajar respecto al pecho.
; Rango: -0.30 a 0.30. Predeterminado: 0.16.
ChestHeight=0.16

; APUNTADO A PIE: correcciones adicionales solo al apuntar normalmente.
; No se aplican a las miras especiales (por ejemplo francotirador).
; Posicion al apuntar = posicion base + correccion de apuntado.
; Con estos valores: avance = 0.20 - 0.06 = 0.14; altura = 0.16 - 0.10 = 0.06.
; Para adelantar la vista normal sin cambiar la de apuntado: aumenta
; ChestForward 0.01 y reduce AimForwardOffset 0.01, dentro de sus limites.

; Avance extra al apuntar: positivo = adelante; negativo = atras.
; Rango: -0.15 a 0.15. Predeterminado: -0.06.
; El avance final siempre se limita a 0.05...0.35.
AimForwardOffset=-0.06

; Altura extra al apuntar: positivo = subir; negativo = bajar.
; Rango: -0.20 a 0.20. Predeterminado: -0.10.
; La altura final siempre se limita a -0.30...0.30.
AimHeightOffset=-0.10

[Effects]
; Efecto ligero de grabacion: grano animado y bordes un poco mas oscuros.
; 1 = activado (defecto), 0 = desactivado. Solo en la vista bodycam.
; No requiere ENB, ReShade ni shaders externos. No incluye motion blur.
; Para priorizar rendimiento, prueba RecordingEffect=0.
RecordingEffect=1

; Fuerza del efecto. Rango: 0.0 a 1.0. Predeterminado: 0.25 (suave).
; 0 tambien lo desactiva. No afecta al texto, al FOV ni a la posicion.
EffectIntensity=0.25
